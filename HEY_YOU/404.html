<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Video Player</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #111; color: #eee; font: 16px Arial, sans-serif; }
    main { width: min(100%, 1000px); margin: 0 auto; padding: 16px; }
    #player-wrap { width: 100%; aspect-ratio: 16 / 9; background: #000; }
    #player { width: 100%; height: 100%; }
    #message { padding: 12px 0; color: #ccc; }
    .controls { display: flex; gap: 8px; margin-top: 10px; }
    button { border: 1px solid #777; border-radius: 0; background: #222; color: white; padding: 9px 14px; font-size: 15px; cursor: pointer; }
    button:hover { background: #333; }
    button:disabled { color: #888; cursor: default; }
    @media (max-width: 520px) { main { padding: 8px; } }
  </style>
</head>
<body>
  <main>
    <div id="player-wrap"><div id="player"></div></div>
    <div id="message" role="status">Add a YouTube video ID to the end of this page's URL.</div>
    <div class="controls">
      <button id="back" type="button" disabled>−10 seconds</button>
      <button id="forward" type="button" disabled>+10 seconds</button>
    </div>
  </main>

  <script>
    (() => {
      const message = document.getElementById('message');
      const back = document.getElementById('back');
      const forward = document.getElementById('forward');
      let player = null;
      let ready = false;

      // The final URL section is the video ID. Remove accidental trailing
      // markdown asterisks, but do not alter the case of the actual ID.
      const parts = location.pathname.split('/').filter(Boolean);
      const rawId = parts.length ? decodeURIComponent(parts[parts.length - 1]) : '';
      const videoId = rawId.replace(/\*+$/, '').trim();
      const validId = /^[A-Za-z0-9_-]{11}$/.test(videoId);

      function say(text) { message.textContent = text; }
      function skip(seconds) {
        if (!ready || !player) return;
        const current = player.getCurrentTime() || 0;
        const duration = player.getDuration() || Infinity;
        player.seekTo(Math.max(0, Math.min(duration, current + seconds)), true);
      }

      back.addEventListener('click', () => skip(-10));
      forward.addEventListener('click', () => skip(10));

      if (!validId) {
        say('No valid YouTube video ID was found in the URL. Use /REPOSITORY/VIDEO_ID.');
        return;
      }

      say('Loading video…');

      window.onYouTubeIframeAPIReady = () => {
        const playerVars = {
          autoplay: 0,
          controls: 1,
          playsinline: 1,
          rel: 0,
          enablejsapi: 1,
          origin: location.origin
        };
        player = new YT.Player('player', {
          videoId,
          width: '100%',
          height: '100%',
          playerVars,
          events: {
            onReady: () => {
              ready = true;
              back.disabled = false;
              forward.disabled = false;
              say('');
            },
            onError: event => {
              const errors = {
                2: 'Invalid video ID.',
                5: 'This video cannot be played in the embedded player.',
                100: 'Video not found, removed, or private.',
                101: 'The video owner does not allow embedded playback.',
                150: 'The video owner does not allow embedded playback.',
                153: 'YouTube could not verify the embed request. Try opening the GitHub Pages URL directly.'
              };
              say(errors[event.data] || `YouTube player error (${event.data}).`);
            }
          }
        });
      };

      const api = document.createElement('script');
      api.src = 'https://www.youtube.com/iframe_api';
      api.async = true;
      api.onerror = () => say('Could not load YouTube. Check your connection or browser content blocker.');
      document.head.appendChild(api);
    })();
  </script>
</body>
</html>
