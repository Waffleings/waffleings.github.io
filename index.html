<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Main Stuff</title>
  <style>
    body {
      margin: 24px;
      font-family: Arial, Helvetica, sans-serif;
      color: #111;
      background: #fff;
    }
    h1 {
      margin: 0 0 16px;
      font-size: 28px;
    }
    ul {
      padding-left: 22px;
      line-height: 1.8;
    }
    a {
      color: #0645ad;
    }
    #status {
      color: #555;
    }
  </style>
</head>
<body>
  <h1>Main Stuff</h1>
  <p id="status">Loading repository files...</p>
  <ul id="links"></ul>

  <script>
    // Usually GitHub Pages can determine these automatically from the page URL.
    // Fill these in only if automatic detection does not work.
    const OWNER_OVERRIDE = "";
    const REPO_OVERRIDE = "";

    // Leave blank if this index.html is published from the repository root.
    // Use "docs" if GitHub Pages publishes from the /docs folder.
    const SOURCE_FOLDER = "";

    const owner = OWNER_OVERRIDE || location.hostname.split(".")[0];
    const pathParts = location.pathname.split("/").filter(Boolean);
    const repo = REPO_OVERRIDE || pathParts[0] || `${owner}.github.io`;

    const status = document.getElementById("status");
    const list = document.getElementById("links");

    function addLink(label, href) {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.textContent = label;
      a.href = href;
      li.appendChild(a);
      list.appendChild(li);
    }

    async function loadMainStuff() {
      const folderPath = SOURCE_FOLDER
        ? `/contents/${SOURCE_FOLDER.split("/").map(encodeURIComponent).join("/")}`
        : "/contents";
      const apiUrl = `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}${folderPath}`;

      const response = await fetch(apiUrl, {
        headers: { "Accept": "application/vnd.github+json" }
      });
      if (!response.ok) {
        throw new Error(`GitHub API returned ${response.status}`);
      }

      const items = await response.json();
      if (!Array.isArray(items)) {
        throw new Error("GitHub did not return a folder listing.");
      }

      // Show files directly in the repository's main folder, but not other folders.
      // The Bad Piggies folder is the one intentional folder link.
      const files = items
        .filter(item => item.type === "file")
        .filter(item => !item.name.startsWith("."))
        .filter(item => item.name.toLowerCase() !== "index.html")
        .sort((a, b) => a.name.localeCompare(b.name));

      const badPiggies = items.find(item =>
        item.type === "dir" &&
        item.name.toLowerCase().replace(/[ _-]/g, "") === "badpiggies"
      );

      for (const file of files) {
        // Relative links open the published root-level file on GitHub Pages.
        addLink(file.name, `./${encodeURIComponent(file.name)}`);
      }

      if (badPiggies) {
        // Open the folder in GitHub so it works even if it has no index.html.
        addLink(badPiggies.name, badPiggies.html_url);
      }

      status.textContent = files.length || badPiggies
        ? ""
        : "No root-level files or Bad Piggies folder were found.";
    }

    loadMainStuff().catch(error => {
      console.error(error);
      status.textContent = "Couldn't load the repository listing. Check the OWNER / REPO settings in this file, and make sure the repository is public.";
    });
  </script>
</body>
</html>
